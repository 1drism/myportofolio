<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ name }} - Portfolio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css"> 
</head>
<body>
    <header class="site-header">
        <div class="container">
            <a href="{% url 'main:show_main' %}" class="brand">
                <img src="/static/img/dsr-logo.png" alt="Idris" class="brand-logo">
            </a>
            <nav>
                <a href="{% url 'main:show_main' %}">Profile</a>
                <a href="{% url 'main:show_experience' %}">Experience</a>
            </nav>
        </div>
    </header>
    <main>
        <section class="welcome">
            <img src="/static/img/banana-cat-image.png" alt="" class="decoration-cat cat-banana">
            <h1 class="welcome-text">Welcome to my</h1>
            <img src="/static/img/portfolio-img.png" alt="Portfolio" class="welcome-bottom">
            <img src="/static/img/milk-cat-image.png" alt="" class="decoration-cat cat-milk">
        </section>
        <div class="divider">
        </div>
        <section class="hero" id="profile">
            <div class="container hero-grid">
                <div class="hero-identity">
                    <p class="hero-kicker">Computer Science &middot; Universitas Indonesia</p>
                    <h1>{{ name }}</h1>
                </div>
                <div class="hero-photo">
                    <img class="avatar avatar-default" src="/static/img/avatar-image.jpg" alt="Photo of {{ name }}">
                    <img class="avatar avatar-hover" src="/static/img/hover-image.png" alt=" :)">
                    <img class="hover-me" src="/static/img/try-hover-me.png" alt="Try hovering the photo">
                </div>
                <div class="hero-details">
                    <p class="bio">{{ bio }}</p>
                    <dl class="meta-list">
                        <div class="meta-row">
                            <dt>NPM</dt>
                            <dd>{{ npm }}</dd>
                        </div>
                        <div class="meta-row">
                            <dt>Program</dt>
                            <dd>{{ study_program }}</dd>
                        </div>
                    </dl>
                    <div class="social-links">
                        <a href="https://github.com/1drism" class="social-link">GitHub</a>
                        <a href="https://linkedin.com/in/muhamad-idris-kamal/" class="social-link">LinkedIn</a>
                        <a href="mailto:idriskamal1107@gmail.com" class="social-link">Email</a>
                    </div>
                </div>
            </div>
        </section>
        <div class="divider">
        </div>
        <section class ="skills" id ="skills">
            <div class ="container">
                <h2>Skills</h2>
                <ul class = "skills-grid">
                    <li class = "skills-card">
                        <img src="/static/img/python-logo.png" alt="Python logo">
                        <span>PYTHON</span>
                    </li>
                    <li class = "skills-card">
                        <img src="/static/img/java-logo.png" alt="Java logo">
                        <span>JAVA</span>
                    </li>
                    <li class = "skills-card">
                        <img src="/static/img/html-logo.png" alt="HTML logo">
                        <span>HTML</span>
                    </li>
                    <li class = "skills-card">
                        <img src="/static/img/css-logo.png" alt="CSS logo">
                        <span>CSS</span>
                    </li>
                    <li class = "skills-card">
                        <img src="/static/img/valorant-logo.png" alt="Adobe Valorant logo">
                        <span>VALORANT</span>
                    </li>
                </ul>
            </div>
        </section>
    </main>

    <footer class="site-footer">
        <div class="container">
            <p>&copy; 2026 {{ name }}. Fakultas Ilmu Komputer, Universitas Indonesia.</p>
        </div>
    </footer>
</body>
</html>
