<!-- One shared modal: JavaScript fills in the institution name and delete URL -->
<div id="delete-education-modal"
     class="delete-modal"
     popover="auto"
     role="dialog"
     aria-modal="true"
     aria-labelledby="delete-education-modal-title">
    <button type="button"
            class="delete-modal__backdrop"
            popovertarget="delete-education-modal"
            popovertargetaction="hide"
            aria-label="Close confirmation"></button>
    <div class="delete-modal__content">
        <button type="button"
                class="delete-modal__close"
                popovertarget="delete-education-modal"
                popovertargetaction="hide"
                aria-label="Close confirmation">×</button>
        <h2 id="delete-education-modal-title">Delete Education?</h2>
        <p>
            Are you sure you want to delete
            <strong id="delete-education-name"></strong>?
        </p>
        <div class="delete-modal__actions">
            <button type="button"
                    class="button button-secondary"
                    popovertarget="delete-education-modal"
                    popovertargetaction="hide">Cancel</button>
            <form id="delete-education-form" method="post" action="">
                {% csrf_token %}
                <button type="submit" class="button button-danger">Yes, Delete</button>
            </form>
        </div>
    </div>
</div>
