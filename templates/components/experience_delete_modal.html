{% load static %}
<button type="button"
        class="action-button action-button--danger label-chip"
        popovertarget="delete-experience-{{ experience.id }}"
        aria-label="Delete {{ experience.title }}"
        title="Delete experience">
    Delete
</button>
<div id="delete-experience-{{ experience.id }}"
     class="modal"
     popover="auto"
     role="dialog"
     aria-modal="true"
     aria-labelledby="delete-experience-title-{{ experience.id }}">
    <button type="button"
            class="modal__backdrop"
            popovertarget="delete-experience-{{ experience.id }}"
            popovertargetaction="hide"
            aria-label="Close confirmation"></button>
    <div class="modal__content">
        <button type="button"
                class="modal__close"
                popovertarget="delete-experience-{{ experience.id }}"
                popovertargetaction="hide"
                aria-label="Close confirmation"><svg class="modal__close-icon" viewBox="0 0 20 20" aria-hidden="true" focusable="false"><use href="{% static 'img/icons/close.svg' %}#close"/></svg></button>
        <h2 class="text-h3" id="delete-experience-title-{{ experience.id }}">Delete Experience?</h2>
        <p class="text-body modal__message">
            Are you sure you want to delete
            <strong>{{ experience.title }}</strong>? This can’t be undone.
        </p>
        <div class="modal__actions">
            <button type="button"
                    class="button button-secondary"
                    popovertarget="delete-experience-{{ experience.id }}"
                    popovertargetaction="hide">Cancel</button>
            <form method="post" action="{% url 'main:delete_experience' experience.id %}">
                {% csrf_token %}
                <button type="submit" class="button button-danger-solid">Yes, Delete</button>
            </form>
        </div>
    </div>
</div>
