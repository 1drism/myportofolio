  {% load static %}
  <div id="toast-component" class="toast-component toast-hidden" popover="manual">
      <div class="toast-content">
          <h3 id="toast-title" class="toast-title">This is a Sample Title</h3>
          <p id="toast-message" class="toast-message">This is a Sample Message</p>
      </div>
  </div>
  <script src="{% static 'js/toast.js' %}"></script>

  {% comment %} Show Django messages (e.g. "Project updated!") as a toast after a redirect {% endcomment %}
  {% for message in messages %}
      {% if forloop.last %}
          <script>
              showToast(
                  "{% if message.level_tag == 'error' %}Error{% elif message.level_tag == 'success' %}Success{% else %}Notification{% endif %}",
                  "{{ message|escapejs }}",
                  "{% if message.level_tag == 'error' %}error{% elif message.level_tag == 'success' %}success{% else %}normal{% endif %}"
              );
          </script>
      {% endif %}
  {% endfor %}
